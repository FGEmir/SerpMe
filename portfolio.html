<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Portfolio — SerpMe</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="liquid.css" />
</head>
<body>
  <main class="site-page portfolio-page">
    <nav class="page-nav">
      <a class="brand" href="/"><span class="logo"><i></i><i></i><i></i></span><span>Serp<span class="brand-accent">Me</span></span><small>MARKET INTELLIGENCE</small></a>
      <div class="nav-links"><a href="/">Analysis</a><a href="/about.html">About</a><button data-logout hidden>Log out</button></div>
    </nav>
    <section class="portfolio-hero"><p class="eyebrow">PERSONAL WORKSPACE</p><h1>Your idea portfolio and <em>decision records.</em></h1><p id="portfolio-user">Loading your portfolio…</p></section>
    <section class="portfolio-grid">
      <div><div class="section-heading"><div><p class="eyebrow">BUSINESS IDEAS</p><h2>Portfolio</h2></div><button id="new-idea-button" class="secondary">New idea</button></div><div id="ideas-list" class="portfolio-list"></div></div>
      <div><div class="section-heading"><div><p class="eyebrow">SAVED ANALYSES</p><h2>Reports</h2></div></div><div id="reports-list" class="portfolio-list"></div></div>
    </section>
    <dialog id="idea-dialog" class="idea-dialog"><form id="idea-form"><button type="button" class="dialog-close" id="dialog-close" aria-label="Close">×</button><p class="eyebrow">NEW BUSINESS IDEA</p><h2>Add to portfolio</h2><label>Idea name<input name="title" maxlength="120" required /></label><label>Concept<input name="concept" maxlength="120" required /></label><label>Location<input name="location" maxlength="200" required /></label><label>Stage<select name="stage"><option value="Fikir">Idea</option><option value="Araştırma">Research</option><option value="Doğrulama">Validation</option><option value="Yatırım">Investment</option></select></label><label>Notes<textarea name="notes" maxlength="4000"></textarea></label><button type="submit">Save idea</button><p id="idea-status" class="form-status"></p></form></dialog>
    <footer class="site-footer"><span>© SerpMe</span><span>Location-based market intelligence</span><a href="/about.html">About</a></footer>
  </main>
  <script src="supabase-config.js"></script>
  <script src="auth.js"></script>
  <script src="portfolio.js"></script>
</body>
</html>
